# Builds apps/web/Dockerfile and pushes it to Artifact Registry.
#   gcloud builds submit --config infra/cloudbuild/web.yaml \
#     --substitutions=_SITE_URL=https://…,_TAG=$(git rev-parse --short HEAD) .
substitutions:
  _REGION: southamerica-east1
  _REPO: casvitta
  _IMAGE: web
  _TAG: latest
  _SITE_URL: ''
  _USE_MOCKS: 'true'
  _GTM_ID: GTM-KT3NQN2G
  # Capture forms post to the real API while the rest of the site still runs on mocks.
  _API_URL: https://api.casvitta.com.br
  # Areas on the real API (lib/live.ts), '+'-separated: interest+accounts
  _LIVE: interest
  _GOOGLE_SITE_VERIFICATION: ''
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_USE_MOCKS=${_USE_MOCKS}
      - --build-arg=NEXT_PUBLIC_GTM_ID=${_GTM_ID}
      - --build-arg=NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg=NEXT_PUBLIC_LIVE=${_LIVE}
      - --build-arg=NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${_GOOGLE_SITE_VERIFICATION}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
options:
  machineType: E2_HIGHCPU_8
timeout: 1200s
